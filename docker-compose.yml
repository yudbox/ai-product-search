version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ai-product-search-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Optional: persist data between restarts
    command: redis-server --save 60 1 --loglevel warning
    # save 60 1 = save DB if at least 1 key changed in 60 seconds
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    driver: local
