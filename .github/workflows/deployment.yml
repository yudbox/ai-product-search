name: 📧 Vercel Deployment Notification

# Webhook Trigger - runs when Vercel sends webhook after successful deployment
# Vercel webhook calls GitHub API: POST /repos/{owner}/{repo}/dispatches
on:
  repository_dispatch:
    types: [vercel-deployment-ready] # Event type sent by Vercel webhook
  workflow_dispatch: # Manual trigger for testing

jobs:
  notify:
    name: 📬 Send Deployment Notifications
    runs-on: ubuntu-latest

    steps:
      # Step 1: Create GitHub Actions Summary
      # Shows a nice report in GitHub Actions UI
      - name: 📝 Create Deployment Summary
        run: |
          echo "=== WORKFLOW START: Vercel Deployment Notification ==="
          echo "Triggered by: ${{ github.event_name }}"


          # Get data from webhook payload
          DEPLOYMENT_URL="${{ github.event.client_payload.deployment_url }}"
          PRODUCTION_URL="${{ github.event.client_payload.production_url }}"
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
          COMMIT_MSG="${{ github.event.client_payload.commit_message }}"
          PROJECT="${{ github.event.client_payload.project_name }}"



          # Create markdown summary for GitHub Actions
          echo "# 🚀 Vercel Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Production URL:** [${PRODUCTION_URL:-$DEPLOYMENT_URL}](${PRODUCTION_URL:-$DEPLOYMENT_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL:** [${DEPLOYMENT_URL}](${DEPLOYMENT_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ${PROJECT}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${COMMIT_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${COMMIT_MSG}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** Vercel Webhook" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "✅ Deployment notification workflow completed"

      # ============================================================
      # Step 2: [PLACEHOLDER] Send Notification
      # ============================================================
      # You can add email or bot notification here:
      #
      # Option 1: Email via SMTP
      # - Use action: dawidd6/action-send-mail@v3
      # - Configure SMTP server (Gmail, SendGrid, etc.)
      # - Add EMAIL_PASSWORD to GitHub Secrets
      #
      # Option 2: Telegram Bot (Recommended)
      # - Create bot via @BotFather
      # - Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to GitHub Secrets
      # - Use: curl -X POST https://api.telegram.org/bot$TOKEN/sendMessage
      #
      # Option 3: Discord Webhook
      # - Create webhook in Discord channel
      # - Add DISCORD_WEBHOOK_URL to GitHub Secrets
      # - Use: curl -X POST $DISCORD_WEBHOOK_URL -d "content=message"
      #
      # Option 4: Slack Webhook
      # - Create Slack app with webhook
      # - Add SLACK_WEBHOOK_URL to GitHub Secrets
      # - Use: curl -X POST $SLACK_WEBHOOK_URL -d '{"text":"message"}'
      # ============================================================

      # Step 3: Console Output
      - name: ✅ Console Output
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT NOTIFICATION WORKFLOW COMPLETED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔗 Production URL:"
          echo "   ${{ github.event.client_payload.production_url || github.event.client_payload.deployment_url }}"
          echo ""
          echo "📦 Project: ${{ github.event.client_payload.project_name }}"
          echo "📝 Commit: ${{ github.event.client_payload.commit_sha }}"
          echo "💬 Message: ${{ github.event.client_payload.commit_message }}"
          echo ""
          echo "💡 To add notifications, uncomment one of the options in Step 2"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "=== WORKFLOW END: Success ==="
