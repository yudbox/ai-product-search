name: CI Pipeline

on:
  pull_request:
    branches: [main] # Только PR в main триггерит CI

jobs:
  quality-checks:
    name: 🔍 Code Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧹 Lint code
        run: npm run lint

      - name: 🔍 Type checking
        run: npm run type-check

      - name: 🧪 Run unit tests with coverage (fails if < 70%)
        run: npm run test:coverage:unit

      - name: 🔗 Run integration tests with coverage (fails if < 70%)
        run: npm run test:coverage:integration

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build
        env:
          # Mock env variables for build (не настоящие!)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key-for-build' }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY || 'mock-key-for-build' }}
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
          OPENAI_EMBEDDING_DIMENSIONS: 1536
          PINECONE_INDEX_NAME: ai-product-search
          PINECONE_NAMESPACE: products

  summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, build]
    if: always()

    steps:
      - name: 📊 Check results
        run: |
          echo "🎉 All checks passed!"
          echo "✅ Code quality checks: PASSED"
          echo "✅ Tests: PASSED"
          echo "✅ Build: PASSED"
          echo ""
          echo "🚀 Ready for deployment to Vercel!"
